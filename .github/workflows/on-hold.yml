# Explicitly fails any PRs that are labeled "On Hold"
# Useful for preventing auto-merge of incompatible dependency bumps

name: Disallow "On Hold" PRs
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches: [main]

jobs:
  label-check:
    name: Run Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for "On Hold" label
        uses: egmacke/action-check-label@v5
        with:
          label: on hold
          state: absent
